  function sfx(kind) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      let f = 440, d = 0.08, type = 'sine', vol = 0.045;
      switch (kind) {
        case 'buy': f = 520; d = 0.07; break;
        case 'sell': f = 300; d = 0.1; break;
        case 'roll': f = 380; d = 0.05; type = 'triangle'; break;
        case 'xp': f = 700; d = 0.07; break;
        case 'level': f = 880; d = 0.2; type = 'triangle'; vol = 0.06; break;
        case 'star': f = 1040; d = 0.25; type = 'triangle'; vol = 0.06; break;
        case 'item': f = 620; d = 0.1; type = 'square'; vol = 0.03; break;
        case 'place': f = 260; d = 0.04; break;
        case 'combat': f = 160; d = 0.3; type = 'sawtooth'; vol = 0.03; break;
        case 'win': o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t + 0.1); o.frequency.setValueAtTime(784, t + 0.2); d = 0.4; break;
        case 'lose': o.frequency.setValueAtTime(392, t); o.frequency.setValueAtTime(311, t + 0.12); o.frequency.setValueAtTime(233, t + 0.24); d = 0.45; break;
        case 'augment': f = 940; d = 0.22; type = 'sine'; vol = 0.05; break;
        default: break;
      }
      o.type = type;
      if (kind !== 'win' && kind !== 'lose') o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) { }
  }

  /* ================= TOOLTIP ================= */
  const tip = { el: null };
  function showTooltip(html, x, y) {
    const el = $('#tooltip');
    if (!el) return;
    el.innerHTML = html;
    el.classList.remove('hidden');
    const pad = 14;
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect();
      let left = x + pad, top = y + pad;
      if (left + r.width > window.innerWidth - 8) left = x - r.width - pad;
      if (top + r.height > window.innerHeight - 8) top = y - r.height - pad;
      el.style.left = Math.max(6, left) + 'px';
      el.style.top = Math.max(6, top) + 'px';
    });
  }
  function hideTooltip() { const el = $('#tooltip'); if (el) el.classList.add('hidden'); }
  function showUnitTooltip(u, x, y, enemy) {
    if (!u) return;
    const ch = champOf(u);
    const star = u.star || 1;
    const traits = (ch.traits || []).map(t => {
      const d = DATA.TRAITS[t];
      return `<div class="tt-trait"><b>${d.icon} ${d.name}</b> · ${d.tiers.map(tt => tt.n).join('/')}</div>`;
    }).join('');
    const items = (u.items || []).map(it => `<div class="tt-trait" style="color:#ffd166">${it.icon} <b>${it.name}</b> — ${it.desc || DATA.SPECIAL_DESC[it.special] || ''}</div>`).join('');
    const stats = u.maxHp && u.maxMana !== undefined
      ? `<div class="tt-stat">❤️ <b>${Math.round(u.hp)}/${Math.round(u.maxHp)}</b> · ⚔️ <b>${Math.round(u.ad)}</b> · 🛡️ <b>${Math.round(u.armor)}</b> · 🔮 <b>${Math.round(u.mr)}</b></div>`
      : `<div class="tt-stat">❤️ <b>${Math.round(ch.hp * DATA.STAR_MULT.hp[star - 1])}</b> · ⚔️ <b>${Math.round(ch.ad * DATA.STAR_MULT.ad[star - 1])}</b> · 🛡️ <b>${ch.armor}</b> · 🔮 <b>${ch.mr}</b> · 🏹 <b>${ch.range}</b></div>`;
    showTooltip(`
      <h4>${ch.icon} ${ch.name} <span style="color:${['#8b9bb7', '#4ad48a', '#3ba7ff', '#b06bff', '#f2c14e'][ch.cost - 1] || '#fff'}">${'★'.repeat(star)}</span></h4>

  /* ================= TOAST ================= */
  function toast(msg, kind) {
    const root = $('#toast-root');
    if (!root) return;
    const d = document.createElement('div');
    d.className = 'toast ' + (kind || '');
    d.textContent = msg;
    root.appendChild(d);
    setTimeout(() => { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 320); }, 1900);
    while (root.children.length > 4) root.firstChild.remove();
  }

    root.innerHTML = `<div class="modal">${html}</div>`;
    root.classList.remove('hidden');
    if (opts && opts.dismissable) {
      root.onclick = e => { if (e.target === root) hideModal(); };
    } else root.onclick = null;

    root.classList.add('hidden');
    root.innerHTML = '';

  /* Rakip keşfi (scouting) */
  function showScout(bot) {
    if (!bot || !bot.board || !bot.board.length) { toast('Bu oyuncunun tahtası yok', 'bad'); return; }
    const cells = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
      const u = bot.board.find(x => x.r === r && x.c === c);
      if (u) {
        const ch = CH[u.champId];
        cells.push(`<div style="display:flex;align-items:center;gap:4px;background:#16233a;border:1px solid #2b3f5e;border-radius:6px;padding:3px 4px">
          <span style="font-size:15px">${ch.icon}</span>
          <span style="font-size:9px;color:#dbe4f3">${ch.name}</span>
          <span style="font-size:8px;color:#ffd166">${'★'.repeat(u.star)}</span>
        </div>`);
      } else {
        cells.push(`<div style="background:#0d1626;border:1px dashed #1c2942;border-radius:6px;height:24px"></div>`);
      }
    }
    const traits = {};
    bot.board.forEach(u => (CH[u.champId].traits || []).forEach(t => traits[t] = (traits[t] || 0) + 1));
    const trHtml = Object.keys(traits).sort((a, b) => traits[b] - traits[a]).map(t => {
      const def = DATA.TRAITS[t]; let tier = 0; def.tiers.forEach((tt, i) => { if (traits[t] >= tt.n) tier = i + 1; });
      return `<span style="display:inline-flex;gap:3px;align-items:center;font-size:10px;padding:2px 6px;border-radius:5px;margin:2px;background:${tier ? '#2a2211' : '#121d30'};border:1px solid ${tier ? '#7a5c1e' : '#22314a'};color:${tier ? '#ffd98a' : '#93a7c4'}">${def.icon} ${def.name} <b>${traits[t]}</b></span>`;
    }).join('');
    openModal(`
      <h2>${bot.icon} ${bot.name}</h2>
      <p class="sub">Can: <b>${bot.hp}</b> · Seviye: <b>${bot.level}</b> · Güç: <b>${bot.power}</b></p>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells.join('')}</div>
      <div style="margin-top:12px">${trHtml}</div>
      <div class="modal-actions"><button class="btn" id="scout-close">KAPAT</button></div>`);
    const b = $('#scout-close'); if (b) b.addEventListener('click', hideModal);
  }

  function combatUnitEl(u) {
    let el = combatTokens.get(u.uid);
    if (el) return el;
    el = makeToken(u, { enemy: u.team === 'enemy', combat: true });
    const p = unitPos(u);
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    $('#unit-layer').appendChild(el);
    combatTokens.set(u.uid, el);
    return el;
  }

  function unitPos(u) {
    if (!u) return { x: 0, y: 0 };
    const a = hexCenter(u.fromR !== undefined ? u.fromR : u.r, u.fromC !== undefined ? u.fromC : u.c);
    const b = hexCenter(u.r, u.c);
    const t = clamp(u.moveT === undefined ? 1 : u.moveT, 0, 1);
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }

  function positionCombatTokens(full) {
    if (!S.combat) return;
    const cb = S.combat;
    if (full) {
      combatTokens.clear();
      const layer = $('#unit-layer');
      if (layer) layer.innerHTML = '';
    }
    cb.allyUnits.concat(cb.enemyUnits).forEach(u => {
      if (!u.alive) {
        const el = combatTokens.get(u.uid);
        if (el && !el.classList.contains('dead')) {
          el.classList.add('dead');
          setTimeout(() => { el.remove(); combatTokens.delete(u.uid); }, 460);
        }
        return;
      }
      const el = combatUnitEl(u);
      const p = unitPos(u);
      el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
      if (!el._refs) {
        el._refs = {
          hp: el.querySelector('.hp-bar i'),
          sh: el.querySelector('.hp-bar .shield'),
          mp: el.querySelector('.mana-bar i'),
          st: el.querySelector('.unit-stars')
        };
      }
      const R = el._refs;
      el.classList.toggle('stunned', !!u.stunT && u.stunT > 0);
      el.classList.toggle('casting', !!u.casting && u.castT > 0);
      if (R.hp) R.hp.style.width = clamp((u.hp / u.maxHp) * 100, 0, 100) + '%';
      if (R.sh) {
        if (u.shield > 0) { R.sh.style.display = 'block'; R.sh.style.width = clamp((u.shield / u.maxHp) * 100, 0, 100) + '%'; }
        else R.sh.style.display = 'none';
      }
      if (R.mp && u.maxMana) R.mp.style.width = clamp((u.mana / u.maxMana) * 100, 0, 100) + '%';
    });
    const aa = $('#ally-alive'), ea = $('#enemy-alive');
    if (aa) aa.textContent = cb.aliveCount('ally');
    if (ea) ea.textContent = cb.aliveCount('enemy');
  }

  function clearFx() {
    fxEls.forEach(e => e.remove());
    fxEls = [];
    const layer = $('#fx-layer');
    if (layer) layer.innerHTML = '';
  }
  function addFx(el, ttl) {
    $('#fx-layer').appendChild(el);
    fxEls.push(el);
    setTimeout(() => { el.remove(); fxEls = fxEls.filter(x => x !== el); }, ttl || 700);
  }

  function fxText(u, text, cls) {
    const p = unitPos(u);
    const d = document.createElement('div');
    d.className = 'fx-text ' + (cls || 'dmg');
    d.textContent = text;
    d.style.left = (p.x + (Math.random() * 16 - 8)) + 'px';
    d.style.top = (p.y - 14) + 'px';
    addFx(d, 950);
  }
  function fxLine(a, b, cls) {
    const pa = unitPos(a), pb = unitPos(b);
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const len = Math.hypot(dx, dy);
    const d = document.createElement('div');
    d.className = cls || 'fx-line';
    d.style.left = pa.x + 'px'; d.style.top = pa.y + 'px';
    d.style.width = len + 'px';
    d.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    addFx(d, 300);
  }
  function fxAoe(center, radius, kind) {
    const p = unitPos(center);
    const d = document.createElement('div');
    d.className = 'fx-aoe ' + (kind || '');
    const rad = radius === 0 ? hexW * 0.5 : (hexW * (0.9 + radius * 1.05));
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    d.style.width = rad * 2 + 'px'; d.style.height = rad * 2 + 'px';
    addFx(d, 560);
  }
  function fxSlash(u) {
    const p = unitPos(u);
    const d = document.createElement('div');
    d.className = 'fx-slash';
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    addFx(d, 320);
  }

  function handleEvent(ev) {
    if (!S.combat) return;
    switch (ev.type) {
      case 'attack':
        if (Math.random() < 0.7) {
          if (ev.ranged) fxLine(ev.from, ev.to, 'fx-line');
          else { fxSlash(ev.to); }
        }
        break;
      case 'damage': {
        const t = ev.amount;
        if (t >= 1) {
          const crit = ev.crit;
          fxText(ev.unit, (crit ? '💥' : '') + Math.round(t), crit ? 'crit' : ev.dmgType === 'magic' ? 'magic' : ev.dmgType === 'true' ? 'true' : 'dmg');
        }
        break;
      }
      case 'heal': if (ev.amount >= 1) fxText(ev.unit, '+' + Math.round(ev.amount), 'heal'); break;
      case 'shield': fxText(ev.unit, '🛡+' + Math.round(ev.amount), 'heal'); break;
      case 'aoe': fxAoe(ev.center, ev.radius || 1, ev.kind); break;
      case 'cast': fxAoe(ev.unit, 0.35, 'magic'); break;
      case 'chain': case 'statikk': case 'runaan': fxLine(ev.from, ev.to, 'fx-bolt'); break;
      case 'blade': fxSlash(ev.from || ev.unit); break;
      case 'silver': if (ev.to) fxText(ev.to, '💀', 'true'); break;
      case 'dodge': fxText(ev.unit, 'KAÇTI', 'heal'); break;
      case 'stun': fxText(ev.unit, '💫', 'magic'); break;
      case 'stealth': fxText(ev.unit, '🌙', 'magic'); break;
      case 'redemption': fxAoe(ev.unit, 1.3, 'heal'); break;
      case 'death': fxText(ev.unit, '☠', 'dmg'); break;
      default: break;
    }
  }

  function updateCombat(dt) {
    const cb = S.combat;
    if (!cb) return;
    if (!cb.over) {
      let total = dt * (S.speed || 1);
      let guard = 0;
      while (total > 0 && guard < 10) {
        const step = Math.min(0.05, total);
        cb.update(step);
        total -= step; guard++;
      }
      cb.drainEvents().forEach(handleEvent);
      positionCombatTokens();
      renderTimer();
    } else {
      cb.drainEvents().forEach(handleEvent);
      positionCombatTokens();
      if (combatEndDelay < 0) combatEndDelay = 0.7;
      combatEndDelay -= dt;
      if (combatEndDelay <= 0) {
        combatEndDelay = -1;
        if (S.phase === 'combat') G.combatDone();
      }
    }
  }

  function skipCombat() {
    const cb = S.combat;
    if (!cb) return;
    let guard = 0;
    while (!cb.over && guard < 4000) { cb.update(0.05); cb.drainEvents(); guard++; }
    cb.drainEvents();
    positionCombatTokens();
    if (S.phase === 'combat') G.combatDone();
  }

  /* ================= SÜRÜKLE-BIRAK ================= */
  let drag = null;
  let selectedItemSlot = null;

  function setHint(html) {
    const el = $('#item-hint');
    if (!el) return;
    if (html) { el.innerHTML = html; el.classList.remove('hidden'); }
    else { el.classList.add('hidden'); }
  }
  function updateItemHint() {
    const it = selectedItemSlot !== null ? S.items[selectedItemSlot] : null;
    if (it) {
      setHint(`${it.icon} <b>${it.name}</b> — bir birime dokun (tak) veya başka bir bileşene dokun (birleştir)`);
      return;
    }
    const u = (S.selectedUid && document.body.classList.contains('is-mobile')) ? G.unitByUid(S.selectedUid) : null;
    if (u && u.r < 0) {
      setHint(`👆 <b>${CH[u.champId].name}</b> — tahtada bir kareye dokun (yerleştir) · bilgi için tekrar dokun`);
      return;
    }
    setHint('');
  }
  function clearItemSelection() {
    if (selectedItemSlot === null) return;
    selectedItemSlot = null;
    updateItemHint(); renderItems();
  }

  function startDrag(e, data) {
    drag = Object.assign({
      startX: e.clientX, startY: e.clientY, moved: false,
      ghost: null, el: null
    }, data);
  }

  function beginGhost() {
    drag.moved = true;
    document.body.classList.add('dragging-unit');
    const ghost = document.createElement('div');
    ghost.id = 'drag-ghost';
    if (drag.kind === 'unit') {
      const u = G.unitByUid(drag.uid);
      const ch = champOf(u);
      ghost.innerHTML = `<div class="unit-token c${ch.cost || 1}" style="position:static;width:${hexW * 0.94}px;height:${hexW * 0.94}px;transform:none">
        <div class="unit-inner"><div class="unit-ring"></div><div class="unit-portrait">${ch.icon}</div>
        <div class="unit-stars">${'★'.repeat(u.star || 1)}</div></div></div>`;
    } else {
      const it = S.items[drag.itemSlot];
      ghost.innerHTML = `<div style="font-size:${Math.round(hexW * 0.5)}px;filter:drop-shadow(0 4px 8px #000)">${it.icon}</div>`;
    }
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    if (drag.el) drag.el.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag || !drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top = y + 'px';
    // hex hover
    $$('.hex.hover, .hex.invalid, .bench-slot.hover, .item-slot.hover').forEach(el => el.classList.remove('hover', 'invalid'));
    const under = document.elementFromPoint(x, y);
    if (!under) return;
    const overToken = under.closest('.unit-token');
    if (overToken && drag.kind === 'unit' && +overToken.dataset.uid !== drag.uid) {
      const tu = G.unitByUid(+overToken.dataset.uid);
      if (tu && tu.r >= 0) { $$('.hex.hover').forEach(el => el.classList.remove('hover')); }
    }
    const hex = under.closest('.hex');
    if (hex) {
      const r = +hex.dataset.r;
      if (drag.kind === 'unit') hex.classList.add(r >= 4 ? 'hover' : 'invalid');
      else hex.classList.add('hover');
    }
    const bs = under.closest('.bench-slot');
    if (bs && drag.kind === 'unit') bs.classList.add('hover');
    const is = under.closest('.item-slot');
    if (is && drag.kind === 'item' && is !== drag.el) is.classList.add('hover');
    const sell = under.closest('#sell-zone');
    if (sell) sell.classList.add('hot');
  }

  function endDrag(e) {
    if (!drag) return;
    const x = e.clientX, y = e.clientY;
    const ghost = drag.ghost;
    if (ghost) ghost.remove();
    document.body.classList.remove('dragging-unit');
    if (drag.el) drag.el.classList.remove('dragging');
    $$('.hex.hover,.hex.invalid,.bench-slot.hover,.item-slot.hover').forEach(el => el.classList.remove('hover', 'invalid'));
    const d = drag; drag = null;
    if (!d.moved) { handleTap(d); return; }
    const under = document.elementFromPoint(x, y);
    if (!under) return;
    if (d.kind === 'unit') {
      if (under.closest('#sell-zone') || under.closest('.shop-block') || under.closest('#shop')) { G.sellUnit(d.uid); return; }
      const targetToken = under.closest('.unit-token');
      if (targetToken && +targetToken.dataset.uid !== d.uid) {
        const tu = G.unitByUid(+targetToken.dataset.uid);
        if (tu) {
          if (tu.r >= 0) { G.placeUnit(d.uid, tu.r, tu.c); return; }
          const bi = S.bench.findIndex(b => b && b.uid === tu.uid);
          if (bi >= 0) { G.benchUnit(d.uid, bi); return; }
        }
      }
      const hex = under.closest('.hex');
      if (hex) { G.placeUnit(d.uid, +hex.dataset.r, +hex.dataset.c); return; }
      const bs = under.closest('.bench-slot');
      if (bs) { G.benchUnit(d.uid, +bs.dataset.bench); return; }
    } else if (d.kind === 'item') {
      const unitEl = under.closest('.unit-token');
      if (unitEl) { G.equipItem(+unitEl.dataset.uid, d.itemSlot); return; }
      const is = under.closest('.item-slot');
      if (is) {
        const to = +is.dataset.item;
        if (to !== d.itemSlot) {
          const A = S.items[d.itemSlot], B = S.items[to];
          if (A && B) {
            if (A.comp && B.comp) G.combineItems(d.itemSlot, to);
            else { toast('Sadece iki bileşen birleşir', 'bad'); }
          } else if (A) G.moveItemToSlot(d.itemSlot, to);
        }
        return;
      }
    }
  }

  function handleTap(d) {
    if (d.kind === 'unit') {
      const u = G.unitByUid(d.uid);
      if (!u) return;
      if (selectedItemSlot !== null) {
        const it = S.items[selectedItemSlot];
        if (!it) { clearItemSelection(); return; }
        if (G.equipItem(d.uid, selectedItemSlot)) { selectedItemSlot = null; updateItemHint(); renderItems(); }
        return;
      }
      S.selectedUid = d.uid;
      renderInfo();
      if (document.body.classList.contains('is-mobile')) {
        renderBoardUnits(); renderBench();
        if (u.r < 0 && d.prevSel !== d.uid) { updateItemHint(); return; } // yedekte: ilk dokunuş seçer
        openUnitSheet(d.uid);
      } else {
        updateItemHint();
      }
    } else if (d.kind === 'item') {
      const slot = d.itemSlot;
      if (selectedItemSlot === slot) { clearItemSelection(); return; }
      if (selectedItemSlot === null) { selectedItemSlot = slot; }
      else {
        const A = S.items[selectedItemSlot], B = S.items[slot];
        if (A && B) {
          if (A.comp && B.comp) {
            G.combineItems(selectedItemSlot, slot);
            selectedItemSlot = null;
          } else if (!A.comp && B.comp) {
            selectedItemSlot = slot;
          } else {
            G.moveItemToSlot(selectedItemSlot, slot);
            selectedItemSlot = slot;
          }
        } else if (A) {
          G.moveItemToSlot(selectedItemSlot, slot);
          selectedItemSlot = slot;
        }
      }
      updateItemHint(); renderItems();
    }
  }

  /* ================= ALT SAYFA: BİRİM ================= */
  function openUnitSheet(uid) {

    const root = $('#sheet-root');
    if (!u || !root) return;
    const ch = CH[u.champId];

    const ad = Math.round(ch.ad * DATA.STAR_MULT.ad[u.star - 1]);

      ? u.items.map(it => `<div class="sheet-item ${it.completed ? 'completed' : ''}" title="${it.name}">${it.icon}</div>`).join('')

    root.innerHTML = `

            <span class="portrait-icon">${ch.icon}</span>
          </div>
          <div style="flex:1;min-width:0">
            <div class="sheet-name">${ch.name} <span class="sheet-stars">${'★'.repeat(u.star)}</span></div>
            <div class="sheet-traits">${ch.traits.map(t => DATA.TRAITS[t].icon + ' ' + DATA.TRAITS[t].name).join(' · ')}</div>
            <div class="sheet-traits" style="color:#ffd166;margin-top:2px">${ch.cost} 🪙 · Satış ${G.sellPrice(u)} 🪙</div>
          </div>
        </div>
        <div class="sheet-stats">
          <div class="sheet-stat"><b>${hp}</b><span>CAN</span></div>
          <div class="sheet-stat"><b>${ad}</b><span>SALDIRI</span></div>
          <div class="sheet-stat"><b>${ch.armor}</b><span>ZIRH</span></div>
          <div class="sheet-stat"><b>${ch.mr}</b><span>DİRENÇ</span></div>
          <div class="sheet-stat"><b>${ch.range}</b><span>MENZİL</span></div>
          <div class="sheet-stat"><b>${ch.mana}</b><span>MANA</span></div>
        </div>
        <div class="sheet-ability"><b>✨ ${ch.ability.name}</b><br>${ch.ability.text}<br><span style="color:#8be0a0">${DATA.abilityText(ch, u.star)}</span></div>

        <div class="sheet-actions">

    setHint('');

    const sellBtn = root.querySelector('[data-sheet-sell]');
    if (sellBtn) sellBtn.addEventListener('click', () => { G.sellUnit(uid); closeSheet(); });

  }
  function closeSheet() {
    const root = $('#sheet-root');
    if (!root) return;
    root.classList.add('hidden');
    root.innerHTML = '';
  }

  /* ================= ÇEKMECE: SİNERJİLER ================= */
  function openDrawer() {
    const p = $('#traits-panel'); if (!p) return;
    p.classList.add('open');
    const bd = $('#drawer-backdrop'); if (bd) bd.classList.add('show');
  }
  function closeDrawer() {
    const p = $('#traits-panel'); if (p) p.classList.remove('open');
    const bd = $('#drawer-backdrop'); if (bd) bd.classList.remove('show');
  }
  function toggleDrawer() {
    const p = $('#traits-panel');
    if (p && p.classList.contains('open')) closeDrawer(); else openDrawer();
  }

  function bindPointer() {
    document.addEventListener('pointerdown', e => {
      if (S.phase === 'gameover') return;
      const unitEl = e.target.closest('.unit-token');
      const itemEl = e.target.closest('.item-slot');
      if (unitEl && !unitEl.classList.contains('enemy-token') && S.phase !== 'combat') {
        const uid = +unitEl.dataset.uid;
        const u = G.unitByUid(uid);
        if (!u) return;
        startDrag(e, { kind: 'unit', uid, el: unitEl, prevSel: S.selectedUid });
        S.selectedUid = uid;
        renderInfo();
        e.preventDefault();
      } else if (itemEl && S.items[+itemEl.dataset.item] && S.phase === 'planning') {
        startDrag(e, { kind: 'item', itemSlot: +itemEl.dataset.item, el: itemEl });
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('pointermove', e => {
      if (!drag) return;
      if (!drag.moved) {
        const dist = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
        if (dist < 6) return;
        beginGhost();
      }
      moveGhost(e.clientX, e.clientY);
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('pointerup', e => {
      if (drag) { endDrag(e); e.preventDefault(); }
    });
    document.addEventListener('pointercancel', () => {
      if (drag) {
        if (drag.ghost) drag.ghost.remove();
        document.body.classList.remove('dragging-unit');
        $$('.hex.hover,.hex.invalid,.bench-slot.hover,.item-slot.hover').forEach(el => el.classList.remove('hover', 'invalid'));
        drag = null;
      }
    });
  }

  function bindClicks() {
    document.addEventListener('click', e => {
      if (document.body.classList.contains('is-mobile') && S.phase === 'planning' && S.selectedUid) {
        const hexEl = e.target.closest('#board .hex');
        const bsEl = e.target.closest('.bench-slot');
        const u = G.unitByUid(S.selectedUid);
        if (u && hexEl && !e.target.closest('.unit-token')) {
          G.placeUnit(u.uid, +hexEl.dataset.r, +hexEl.dataset.c);
          S.selectedUid = null; renderInfo(); updateItemHint();
          return;
        }
        if (u && bsEl && u.r >= 0) {
          G.benchUnit(u.uid, +bsEl.dataset.bench);
          S.selectedUid = null; renderInfo(); updateItemHint();
          return;
        }
      }
      const shopCard = e.target.closest('.shop-card');
      if (shopCard && shopCard.dataset.shop !== undefined && S.phase === 'planning') {
        G.buyUnit(+shopCard.dataset.shop); return;
      }
      const sellBtn = e.target.closest('[data-sell]');
      if (sellBtn) { G.sellUnit(+sellBtn.dataset.sell); return; }
      const itemEl = e.target.closest('.item-slot.filled');
      if (itemEl && S.items[+itemEl.dataset.item]) {
        if (document.body.classList.contains('is-mobile')) {
          if (S.phase === 'combat') { showItemTooltip(S.items[+itemEl.dataset.item], e.clientX, e.clientY); setTimeout(hideTooltip, 2200); }
          return;
        }
        const it = S.items[+itemEl.dataset.item];
        showItemTooltip(it, e.clientX, e.clientY);
        setTimeout(hideTooltip, 2200);
      }
      const traitRow = e.target.closest('.trait-row');
      if (traitRow) { showTraitDetail(traitRow.dataset.trait); return; }
      const chip = e.target.closest('.player-chip');
      if (chip && chip.dataset.player && chip.dataset.player !== 'me') {
        const bot = S.bots.find(b => b.id === chip.dataset.player);
        if (bot) showScout(bot);
        return;
      }
      if (chip && chip.dataset.player === 'me') { toast('Bu senin tahtan!', 'bad'); return; }

    });

    // hover tooltipleri (mobilde planlama fazında alt sayfa kullanılır)
    document.addEventListener('mouseover', e => {
      if (document.body.classList.contains('is-mobile') && S.phase !== 'combat') return;
      const unitEl = e.target.closest('.unit-token');
      if (unitEl) {
        if (S.phase === 'combat' && S.combat) {
          const uid = +unitEl.dataset.uid;
          const u = S.combat.allyUnits.concat(S.combat.enemyUnits).find(x => x.uid === uid);
          if (u) showUnitTooltip(u, e.clientX, e.clientY, u.team === 'enemy');
          return;
        }
        const u = G.unitByUid(+unitEl.dataset.uid);
        if (u) showUnitTooltip(u, e.clientX, e.clientY);
        return;
      }
      const shopCard = e.target.closest('.shop-card');
      if (shopCard && shopCard.dataset.shop !== undefined && S.shop[+shopCard.dataset.shop]) {
        showChampTooltip(CH[S.shop[+shopCard.dataset.shop]], e.clientX, e.clientY); return;
      }
      const itemEl = e.target.closest('.item-slot.filled');
      if (itemEl && S.items[+itemEl.dataset.item]) {
        showItemTooltip(S.items[+itemEl.dataset.item], e.clientX, e.clientY); return;
      }
      const traitRow = e.target.closest('.trait-row');
      if (traitRow) { showTraitTooltip(traitRow.dataset.trait, e.clientX, e.clientY); return; }
      const tm = e.target.closest('.tm-chip');
      if (tm) { showTraitTooltip(tm.dataset.trait, e.clientX, e.clientY); return; }
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('.unit-token') || e.target.closest('.shop-card') || e.target.closest('.item-slot') || e.target.closest('.trait-row') || e.target.closest('.tm-chip')) hideTooltip();
    });
  }

  function bindButtons() {
    const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener('click', fn); };
    on('#btn-reroll', () => { if (S.phase === 'planning') G.rollShop(false); });
    on('#btn-xp', () => { if (S.phase === 'planning') G.buyXp(); });
    on('#shop-lock', () => G.toggleLock());
    on('#btn-ready', () => { if (S.phase === 'planning' || S.phase === 'carousel') G.startCombat(); });
    on('#btn-arrange', () => { if (S.phase === 'planning') G.autoArrange(); });
    on('#btn-skip', () => skipCombat());
    on('#btn-speed', () => {
      S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
      $('#btn-speed').textContent = S.speed + 'x';
    });
    on('#btn-sound', () => {
      soundOn = !soundOn;
      $('#btn-sound').textContent = soundOn ? '🔊' : '🔇';
    });
    on('#btn-help', () => showHelp());
    on('#btn-traits', () => toggleDrawer());
    on('#btn-traits-close', () => closeDrawer());
    const bd = $('#drawer-backdrop');
    if (bd) bd.addEventListener('click', closeDrawer);

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === 'd') { if (S.phase === 'planning') G.rollShop(false); }
      else if (k === 'f') { if (S.phase === 'planning') G.buyXp(); }
      else if (k === 'r') { if (S.phase === 'planning' || S.phase === 'carousel') G.startCombat(); }
      else if (k === 'e') { if (S.selectedUid) G.sellUnit(S.selectedUid); }
      else if (k === 'escape') { S.selectedUid = null; renderInfo(); hideTooltip(); }
      else if (k >= '1' && k <= '5') { if (S.phase === 'planning') G.buyUnit(+k - 1); }
      else if (k === ' ') { if (S.phase === 'planning') G.startCombat(); }
    });
  }

  /* ================= RENDER ALL ================= */
  function renderAll() {
    if (!S) return;
    renderTopbar();
    renderBars();
    renderShop();
    renderBench();
    renderItems();
    renderTraits();
    renderInfo();
    if (S.phase !== 'combat') renderBoardUnits();
    renderTimer();
    scheduleMeasure();
  }

  /* ================= ANA DÖNGÜ ================= */
  let lastT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastT) lastT = now;
    let dt = (now - lastT) / 1000;
    lastT = now;
    dt = Math.min(0.06, Math.max(0, dt));
    if (!S) return;
    if (S.phase === 'combat' && S.combat) updateCombat(dt);
    G.tick(dt);

/* ==== game.js ==== */
/* =====================================================================
   TFT ARENA — OFFLINE  |  game.js
   Oyun durumu, ekonomi, mağaza, tur akışı, carousel, augmentlar, botlar
   ===================================================================== */
window.TFT = window.TFT || {};
(function () {
  'use strict';
  const TFT = window.TFT;
  const DATA = TFT.DATA;
  const CH = DATA.CHAMP_BY_ID;
  const Bots = TFT.Bots;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = Math.random;
  const choose = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let UID = 1;
  const S = {};

  function reset() {
    Object.assign(S, {
      stage: 1, round: 1, phase: 'idle', roundType: 'pvp',
      hp: 100, gold: 4, level: 2, xp: 0, streak: 0,
      shop: [null, null, null, null, null], shopLocked: false,
      bench: new Array(DATA.BENCH_SIZE).fill(null),
      board: [],
      items: new Array(DATA.ITEM_BENCH_SIZE).fill(null),
      augments: [], buffs: {},
      bots: [], pool: {},
      timer: 0, timerMax: 30,
      combat: null, opponentId: null,
      selectedUid: null,
      carousel: null, carouselTimer: 0,
      augmentOptions: null,
      result: null, resultTimer: 0,
      alive: true, place: 0,
      stats: { rounds: 0, wins: 0, losses: 0, damage: 0, goldEarned: 0, unitsBought: 0, maxStreak: 0, startTime: Date.now() },
      log: [],
      pveReward: null,
      speed: 1,
      skipRequested: false,
      lastOpponent: null
    });
    UID = 1;
    Object.keys(shownTips).forEach(k => delete shownTips[k]);
    DATA.CHAMPS.forEach(c => { S.pool[c.id] = DATA.POOL_COUNT[c.cost]; });
    S.bots = [];
    for (let i = 0; i < 7; i++) S.bots.push(Bots.makeBot(i));
    S.bench = new Array(DATA.BENCH_SIZE).fill(null);
    S.items = new Array(DATA.ITEM_BENCH_SIZE).fill(null);
  }

  /* ================= YARDIMCILAR ================= */
  const ROLE_MELEE = c => c.range <= 1;

  function roundsInStage(stage) { return stage === 1 ? 4 : 7; }
  function roundPlan(stage, round) {
    if (stage === 1) return ['carousel', 'pve', 'pve', 'pve'][round - 1] || 'pve';
    if (round === 4) return 'carousel';
    if (round === 7) return 'pve';
    return 'pvp';
  }
  // carousel turlarında da savaş olur; 1-1 PvE'dir
  function combatType() {
    if (S.roundType === 'pve') return 'pve';
    if (S.roundType === 'carousel' && S.stage === 1 && S.round === 1) return 'pve';
    if (S.roundType === 'carousel') return 'pvp';
    return 'pvp';
  }
  function roundKey() { return S.stage + '-' + S.round; }
  function isAugmentRound() { return ['2-1', '3-2', '4-2', '5-2'].includes(roundKey()); }

  function allUnits() { return S.board.concat(S.bench.filter(Boolean)); }
  function unitByUid(uid) { return allUnits().find(u => u.uid === +uid); }
  function boardCount() { return S.board.length; }
  function teamSize() { return clamp(S.level + (S.buffs.teamSize || 0), 1, 12); }
  function benchFree() { return S.bench.some(b => !b); }
  function itemFree() { return S.items.some(i => !i); }
  function hasTraitActive(t, n) {
    const counts = traitCounts();
    const def = DATA.TRAITS[t]; if (!def) return false;
    return (counts[t] || 0) >= (n || def.tiers[0].n);
  }
  function traitCounts() {
    const counts = {};
    const seen = new Set();
    S.board.forEach(u => {
      if (seen.has(u.champId)) return;
      seen.add(u.champId);
      const c = CH[u.champId]; if (!c) return;
      c.traits.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
    });
    return counts;
  }
  function activeTraits() {
    const counts = traitCounts(); const out = [];
    Object.keys(counts).forEach(t => {
      const def = DATA.TRAITS[t]; if (!def) return;
      let tier = 0; def.tiers.forEach((tt, i) => { if (counts[t] >= tt.n) tier = i + 1; });
      out.push({ id: t, count: counts[t], tier, def });
    });
    out.sort((a, b) => (b.tier - a.tier) || (b.count - a.count));
    return out;
  }
  function unitAt(r, c) { return S.board.find(u => u.r === r && u.c === c); }

  function makeUnit(champId, star, items) {
    return {
      uid: UID++, champId, star: star || 1,
      items: (items || []).slice(0, DATA.MAX_ITEMS_PER_UNIT),
      r: -1, c: -1
    };
  }
  function mergeCopies(champId, star) {
    const list = allUnits().filter(u => u.champId === champId && u.star === star);
    if (list.length < 3) return null;
    list.sort((a, b) => b.items.length - a.items.length || (a.r >= 0 ? -1 : 1));
    const keep = list[0], a = list[1], b = list[2];
    const items = keep.items.concat(a.items, b.items).slice(0, DATA.MAX_ITEMS_PER_UNIT);
    removeUnit(a.uid); removeUnit(b.uid);
    keep.star = star + 1;
    keep.items = items;
    if (S.selectedUid === a.uid || S.selectedUid === b.uid) S.selectedUid = keep.uid;
    pushLog(`⭐ ${CH[champId].name} ${star + 1} yıldıza yükseldi!`);
    TFT.UI && TFT.UI.toast(`${CH[champId].name} → ${star + 1}★`, 'good');
    TFT.UI && TFT.UI.sfx('star');
    return keep;
  }
  function mergeAll(champId) {
    let changed = true;
    while (changed) {
      changed = false;
      if (mergeCopies(champId, 1)) changed = true;
      if (mergeCopies(champId, 2)) changed = true;
    }
  }
  function addUnitToBench(champId, star, items) {
    const slot = S.bench.findIndex(b => !b);
    if (slot < 0) return null;
    const u = makeUnit(champId, star, items);
    S.bench[slot] = u;
    mergeAll(champId);
    return u;
  }
  function removeUnit(uid) {
    const bi = S.bench.findIndex(u => u && u.uid === uid);
    if (bi >= 0) { S.bench[bi] = null; return; }
    const ii = S.board.findIndex(u => u.uid === uid);
    if (ii >= 0) S.board.splice(ii, 1);
  }

  function sellPrice(u) {
    const c = CH[u.champId].cost;
    if (u.star === 1) return c;
    if (u.star === 2) return c * 3 - 1;
    return c * 9 - 2;
  }

  const shownTips = {};
  function tip(key, msg) {
    if (shownTips[key]) return;
    shownTips[key] = true;
    setTimeout(() => TFT.UI && TFT.UI.toast('💡 ' + msg), 400);
  }

  function pushLog(msg) {
    S.log.unshift({ t: Date.now(), msg });
    if (S.log.length > 60) S.log.pop();
    TFT.UI && TFT.UI.renderLog();
  }

  /* ================= EKONOMİ ================= */
  function addGold(n) {
    S.gold = Math.max(0, S.gold + n);
    if (n > 0) S.stats.goldEarned += n;
    TFT.UI && TFT.UI.renderBars();
  }
  function addXp(n) {
    if (S.level >= DATA.MAX_LEVEL) { S.xp = 0; return; }
    S.xp += n;
    let needed = DATA.XP_TABLE[S.level] || 999;
    while (S.level < DATA.MAX_LEVEL && S.xp >= needed) {
      S.xp -= needed;
      S.level++;
      needed = DATA.XP_TABLE[S.level] || 999;
      TFT.UI && TFT.UI.toast(`Seviye ${S.level}!`, 'good');
      TFT.UI && TFT.UI.sfx('level');
      pushLog(`⬆ Seviye ${S.level}`);
    }
    if (S.level >= DATA.MAX_LEVEL) S.xp = 0;
    TFT.UI && TFT.UI.renderBars();
  }
  function healPlayer(n) {
    S.hp = Math.min(100, S.hp + n);
    TFT.UI && TFT.UI.renderPlayers();
  }
  function addGlobalBuff(key, val) {
    S.buffs[key] = (S.buffs[key] || 0) + val;
    TFT.UI && TFT.UI.renderBars();
  }
  function giveRandomComponent() {
    const comp = DATA.COMPONENTS[choose(DATA.COMP_KEYS)];
    addItem({ id: comp.id, name: comp.name, icon: comp.icon, stats: comp.stats, comp: true, desc: comp.desc });
  }
  function giveRandomCompletedItem() {
    const k = choose(Object.keys(DATA.COMBINED));
    const p = k.split('+');
    addItem(DATA.buildItem(p[0], p[1]));
  }
  function addItem(it) {
    const i = S.items.findIndex(x => !x);
    if (i < 0) { pushLog('Eşya alanı dolu!'); return false; }
    S.items[i] = it;
    TFT.UI && TFT.UI.renderItems();
    return true;
  }

  /* ================= MAĞAZA ================= */
  function shopOdds() {
    const lvl = clamp(S.level + (S.buffs.shopOdds || 0), 1, 9);
    return DATA.SHOP_ODDS[lvl];
  }
  function rollShop(free) {
    const cost = free ? 0 : Math.max(0, DATA.REROLL_COST - (S.buffs.rerollDiscount || 0));
    if (!free) {
      if (S.gold < cost) { TFT.UI && TFT.UI.toast('Yeterli altın yok', 'bad'); return; }
      S.gold -= cost;
      TFT.UI && TFT.UI.sfx('roll');
    }
    const odds = shopOdds();
    S.shop = [];
    for (let i = 0; i < 5; i++) {
      const tier = pickTier(odds);
      const champ = pickChampOfTier(tier);
      S.shop.push(champ ? champ.id : null);
    }
    TFT.UI && TFT.UI.renderShop();
    TFT.UI && TFT.UI.renderBars();
  }
  function pickTier(odds) {
    let r = rnd() * 100, acc = 0;
    for (let i = 0; i < 5; i++) { acc += odds[i]; if (r < acc) return i + 1; }
    return 5;
  }
  function pickChampOfTier(tier) {
    const pool = DATA.CHAMPS.filter(c => c.cost === tier && S.pool[c.id] > 0);
    if (!pool.length) {
      // bu maliyet tükendi → yakın maliyet
      for (let d = 1; d <= 4; d++) {
        const alt = DATA.CHAMPS.filter(c => Math.abs(c.cost - tier) === d && S.pool[c.id] > 0);
        if (alt.length) return choose(alt);
      }
      return null;
    }
    return choose(pool);
  }

  function buyUnit(shopIdx) {
    const id = S.shop[shopIdx];
    if (!id) return;
    const champ = CH[id];
    if (S.gold < champ.cost) { TFT.UI && TFT.UI.toast('Yeterli altın yok', 'bad'); return; }
    if (S.pool[id] <= 0) { TFT.UI && TFT.UI.toast('Stokta kalmadı', 'bad'); return; }
    const hasSpace = benchFree();
    const twoCopies = allUnits().filter(u => u.champId === id && u.star === 1).length >= 2;
    if (!hasSpace && !twoCopies) { TFT.UI && TFT.UI.toast('Yedek alanı dolu', 'bad'); return; }
    S.gold -= champ.cost;
    S.pool[id]--;
    S.shop[shopIdx] = null;
    S.stats.unitsBought++;
    if (hasSpace) {
      addUnitToBench(id, 1, []);
    } else {
      // yedek dolu ama 3. kopya → doğrudan birleştir
      const keep = mergeCopies(id, 1);
      if (!keep) { addGold(champ.cost); S.pool[id]++; S.stats.unitsBought--; TFT.UI && TFT.UI.toast('Yedek alanı dolu', 'bad'); return; }
      mergeAll(id);
    }
    TFT.UI && TFT.UI.sfx('buy');
    if (S.stats.unitsBought >= 2) tip('merge', 'Aynı şampiyondan 3 tane alırsan 2★ olur, 3 tane 2★ ise 3★');
    TFT.UI && TFT.UI.renderAll();
  }

  function buyXp() {
    if (S.level >= DATA.MAX_LEVEL) { TFT.UI && TFT.UI.toast('Maksimum seviye', 'bad'); return; }
    if (S.gold < DATA.XP_COST) { TFT.UI && TFT.UI.toast('Yeterli altın yok', 'bad'); return; }
    S.gold -= DATA.XP_COST;
    addXp(DATA.XP_PER_BUY);
    TFT.UI && TFT.UI.sfx('xp');
    TFT.UI && TFT.UI.renderAll();
  }
  function toggleLock() {
    S.shopLocked = !S.shopLocked;
    TFT.UI && TFT.UI.renderShop();
  }

  /* ================= YERLEŞTİRME ================= */
  function placeUnit(uid, r, c) {
    const u = unitByUid(uid); if (!u) return false;
    if (r < 4) { TFT.UI && TFT.UI.toast('Sadece kendi yarınına yerleştirebilirsin', 'bad'); return false; }
    const occ = unitAt(r, c);
    if (occ && occ.uid === u.uid) return false;
    const fromBench = u.r < 0;
    if (fromBench && boardCount() >= teamSize() && !occ) {
      TFT.UI && TFT.UI.toast(`Takım sınırı: ${teamSize()} birim (seviye ${S.level})`, 'bad');
      return false;
    }
    if (occ) {
      // yer değiştir
      if (fromBench) {
        occ.r = -1; occ.c = -1;
        const bi = S.bench.findIndex(b => b && b.uid === u.uid);
        S.bench[bi] = occ;
        S.board.push(u);
      } else {
        const tr = u.r, tc = u.c;
        u.r = r; u.c = c; occ.r = tr; occ.c = tc;
      }
    } else {
      if (fromBench) {
        const bi = S.bench.findIndex(b => b && b.uid === u.uid);
        S.bench[bi] = null;
        S.board.push(u);
      }
      u.r = r; u.c = c;
    }
    TFT.UI && TFT.UI.sfx('place');
    TFT.UI && TFT.UI.renderAll();
    return true;
  }

  function benchUnit(uid, slot) {
    const u = unitByUid(uid); if (!u) return false;
    if (slot < 0 || slot >= DATA.BENCH_SIZE) return false;
    if (S.bench[slot] && S.bench[slot].uid === u.uid) return false;
    const occ = S.bench[slot];
    const fromBoard = u.r >= 0;
    if (fromBoard) {
      const br = u.r, bc = u.c;
      S.board = S.board.filter(x => x.uid !== u.uid);
      u.r = -1; u.c = -1;
      S.bench[slot] = u;
      if (occ) { // yedekteki birim tahtaya geçer
        occ.r = br; occ.c = bc;
        S.board.push(occ);
      }
    } else {
      const bi = S.bench.findIndex(b => b && b.uid === u.uid);
      S.bench[slot] = u;
      if (bi >= 0) S.bench[bi] = occ || null;
    }
    TFT.UI && TFT.UI.sfx('place');
    TFT.UI && TFT.UI.renderAll();
    return true;
  }

  function autoArrange() {
    if (!S.board.length) { TFT.UI && TFT.UI.toast('Tahtada birim yok', 'bad'); return; }
    const units = S.board.slice();
    S.board = [];
    const colOrder = [3, 2, 4, 1, 5, 0, 6];
    const slots = [];
    // melee: 4,5 ; ranged: 7,6
    [4, 5].forEach(r => colOrder.forEach(c => slots.push({ r, c })));
    [7, 6].forEach(r => colOrder.forEach(c => slots.push({ r, c })));
    const melee = units.filter(u => CH[u.champId].range <= 1).sort((a, b) => CH[b.champId].cost - CH[a.champId].cost);
    const ranged = units.filter(u => CH[u.champId].range > 1).sort((a, b) => CH[b.champId].cost - CH[a.champId].cost);
    const ordered = melee.concat(ranged);
    ordered.forEach((u, i) => {
      const s2 = slots[i];
      u.r = s2.r; u.c = s2.c;
      S.board.push(u);
    });
    TFT.UI && TFT.UI.sfx('place');
    TFT.UI && TFT.UI.renderAll();
  }

  function sellUnit(uid) {
    const u = unitByUid(uid); if (!u) return;
    const price = sellPrice(u);
    addGold(price);
    const lost = u.items.filter(it => !addItem(it)).length;
    if (lost) TFT.UI && TFT.UI.toast(`${lost} eşya sığmadı ve kayboldu!`, 'bad');
    if (S.selectedUid === u.uid) S.selectedUid = null;
    removeUnit(u.uid);
    TFT.UI && TFT.UI.toast(`${CH[u.champId].name} satıldı (+${price} altın)`, 'good');
    TFT.UI && TFT.UI.sfx('sell');
    pushLog(`💰 ${CH[u.champId].name} satıldı`);
    TFT.UI && TFT.UI.renderAll();
  }

  /* ================= EŞYA ================= */
  function equipItem(uid, itemSlot) {
    const u = unitByUid(uid), it = S.items[itemSlot];
    if (!u || !it) return false;
    if (u.items.length >= DATA.MAX_ITEMS_PER_UNIT) {
      TFT.UI && TFT.UI.toast('Bir birime en fazla 3 eşya', 'bad'); return false;
    }
    S.items[itemSlot] = null;
    u.items.push(it);
    TFT.UI && TFT.UI.sfx('item');
    TFT.UI && TFT.UI.renderAll();
    return true;
  }
  function combineItems(a, b) {
    const A = S.items[a], B = S.items[b];
    if (!A || !B || !A.comp || !B.comp) return false;
    const made = DATA.buildItem(A.id, B.id);
    if (!made) return false;
    S.items[a] = made; S.items[b] = null;
    TFT.UI && TFT.UI.toast(`✨ ${made.name} oluşturuldu`, 'good');
    TFT.UI && TFT.UI.sfx('item');
    TFT.UI && TFT.UI.renderAll();
    return true;
  }
  function moveItemToSlot(from, to) {
    if (from === to) return;
    const tmp = S.items[to]; S.items[to] = S.items[from]; S.items[from] = tmp;
    TFT.UI && TFT.UI.renderItems();
  }
  function sellItem(slot) {
    if (!S.items[slot]) return;
    S.items[slot] = null;
    TFT.UI && TFT.UI.renderItems();
  }

  /* ================= CAROUSEL ================= */
  function openCarousel() {
    const opts = [];
    const costs = shuffle([1, 1, 2, 2, 3, 3, 4, 5]).slice(0, 8);
    const champs = shuffle(DATA.CHAMPS);
    for (let i = 0; i < 8; i++) {
      let c = champs.find(ch => ch.cost === costs[i] && !opts.some(o => o.champId === ch.id));
      if (!c) c = champs.find(ch => !opts.some(o => o.champId === ch.id));
      if (!c) break;
      const item = Bots.randomItem(S.stage);
      opts.push({ champId: c.id, item });
    }
    S.carousel = opts;
    S.carouselTimer = 20;
    S.phase = 'carousel';
    S.timer = 20;
    TFT.UI && TFT.UI.showCarousel(opts);
  }
  function pickCarousel(idx) {
    if (S.phase !== 'carousel' || !S.carousel) return;
    const opt = S.carousel[idx]; if (!opt) return;
    const champ = CH[opt.champId];
    if (!benchFree()) {
      const cheapest = S.bench.filter(Boolean).sort((a, b) => sellPrice(a) - sellPrice(b))[0];
      if (cheapest) {
        TFT.UI && TFT.UI.toast('Yedek doluydu: en ucuz birim satıldı', 'bad');
        sellUnit(cheapest.uid);
      }
      if (!benchFree()) { TFT.UI && TFT.UI.toast('Yedek alanı dolu!', 'bad'); return; }
    }
    addUnitToBench(opt.champId, 1, [opt.item]);
    pushLog(`🎠 ${champ.name} seçildi`);
    tip('carousel', 'Eşyayı birimin üzerine sürükleyerek takabilirsin. Birime en fazla 3 eşya takılır');
    S.carousel = null;
    S.phase = 'planning';
    S.timer = 30; S.timerMax = 30;
    TFT.UI && TFT.UI.hideModal();
    TFT.UI && TFT.UI.renderAll();
  }

  /* ================= AUGMENT ================= */
  function openAugment() {
    const pool = shuffle(DATA.AUGMENTS.filter(a => !S.augments.includes(a.id))).slice(0, 3);
    S.augmentOptions = pool;
    S.phase = 'augment';
    TFT.UI && TFT.UI.showAugments(pool);
  }
  function pickAugment(id) {
    const a = DATA.AUGMENTS.find(x => x.id === id); if (!a) return;
    S.augments.push(a.id);
    TFT.UI && TFT.UI.hideModal();
    const api = {
      addGold, addXp, healPlayer, giveRandomComponent, giveRandomCompletedItem, addGlobalBuff
    };
    a.apply(api);
    pushLog(`🧩 Augment: ${a.name}`);
    TFT.UI && TFT.UI.sfx('augment');
    S.phase = 'planning';
    S.augmentOptions = null;
    S.timer = 30; S.timerMax = 30;
    TFT.UI && TFT.UI.renderAll();
  }

  /* ================= TUR AKIŞI ================= */
  function beginRound() {
    if (!S.alive) return;
    S.roundType = roundPlan(S.stage, S.round);
    S.phase = 'planning';
    S.timer = S.stage === 1 ? 25 : 32;
    S.timerMax = S.timer;
    S.opponentId = null;
    S.combat = null;
    S.result = null;
    // botlar kadrolarını kurar
    S.bots.forEach(b => { if (b.alive) Bots.buildBoard(b, S.stage, S.round); });
    // savaş olacaksa rakibi şimdi belirle (önizleme için)
    if (S.roundType === 'pvp' || (S.roundType === 'carousel' && !(S.stage === 1 && S.round === 1))) {
      const opp = pickOpponent();
      if (opp) { S.nextOpponent = opp.id; TFT.UI && TFT.UI.showNextOpponent(opp); }
    } else { S.nextOpponent = null; TFT.UI && TFT.UI.hideNextOpponent(); }
    // mağaza
    if (!S.shopLocked) rollShop(true);
    if (isAugmentRound()) { openAugment(); }
    else if (S.roundType === 'carousel') { openCarousel(); }
    pushLog(`— ${S.stage}-${S.round} · ${S.roundType === 'pve' ? 'PvE' : S.roundType === 'carousel' ? 'Carousel' : 'PvP'} —`);
    if (S.stage === 1 && S.round === 1) tip('start', 'Yedekteki birimi tahtaya sürükle, sonra R ile savaşı başlat');
    if (S.stage === 2 && S.round === 1) tip('trait', 'Sol panelde sinerjilere tıklayarak eşikleri görebilirsin');
    if (S.stage === 3 && S.round === 1) tip('econ', 'Faiz için 10 altın üstü biriktir; seri bonusunu kaçırma');
    TFT.UI && TFT.UI.renderAll();
    TFT.UI && TFT.UI.renderTimer();
  }

  function pickOpponent() {
    const alive = S.bots.filter(b => b.alive);
    if (!alive.length) return null;
    let pool = alive.filter(b => b.id !== S.lastOpponent);
    if (!pool.length) pool = alive;
    const opp = choose(pool);
    S.lastOpponent = opp.id;
    S.opponentId = opp.id;
    return opp;
  }

  function startCombat() {
    if (S.phase === 'combat' || S.phase === 'result' || S.phase === 'gameover') return;
    if (S.phase === 'augment') { TFT.UI && TFT.UI.toast('Önce bir augment seç', 'bad'); return; }
    if (!S.board.length) { TFT.UI && TFT.UI.toast('Tahtada birim yok — bu savaşı kaybedeceksin!', 'bad'); }
    if (S.phase === 'carousel') { autoPickCarousel(); }
    S.phase = 'combat';
    S.result = null;
    const allies = S.board.map(u => ({ champId: u.champId, star: u.star, items: u.items, r: u.r, c: u.c }));
    let enemies = [], label = 'Rakip';
    if (combatType() === 'pve') {
      const waveKey = S.stage === 1 ? (S.round <= 3 ? 1 : 2) : S.stage;
      const p = Bots.pveSpecs(S.stage, waveKey);
      enemies = p.specs;
      label = 'PvE · ' + p.wave.name;
      S.pveReward = p;
    } else {
      let opp = S.bots.find(b => b.id === S.opponentId && b.alive);
      if (!opp) opp = pickOpponent();
      if (opp) {
        enemies = opp.board.map(u => ({ champId: u.champId, star: u.star, items: u.items, r: u.r, c: u.c }));
        label = opp.name + ' ' + opp.icon;
        S.pveReward = null;
      }
    }
    S.opponentLabel = label;
    S.combat = new TFT.Combat(allies, enemies, {
      stage: S.stage,
      allyBuffs: S.buffs
    });
    S.combatTime = 0;
    TFT.UI && TFT.UI.setCombatMode(true);
    TFT.UI && TFT.UI.renderAll();
    TFT.UI && TFT.UI.sfx('combat');
  }

  function combatDone() {
    if (!S.combat || S.result) return;
    const cb = S.combat;
    const win = cb.winner === 'ally';
    const draw = cb.winner === 'draw';
    const survivors = cb.survivors('enemy');
    S.stats.rounds++;
    if (win) S.stats.wins++; else S.stats.losses++;
    if (!win) tip('loss', 'Karakterlerin otomatik savaşır — yıldız, eşya ve sinerji gücü belirler');

    let playerDmg = 0;
    if (!win) playerDmg = damageFor(S.stage, survivors);
    if (draw) playerDmg = Math.ceil(damageFor(S.stage, survivors) * 0.5);

    if (combatType() === 'pve') {
      if (win) {
        addGold(S.pveReward.wave.gold);
        pushLog(`👾 ${S.pveReward.wave.name} yenildi! +${S.pveReward.wave.gold} altın`);
        if (rnd() < S.pveReward.wave.drop) { giveRandomComponent(); pushLog('🎁 Eşya düştü!'); }
      } else {
        S.hp = Math.max(0, S.hp - Math.max(2, Math.round(playerDmg * 0.5)));
        pushLog('💀 PvE dalgası kaybedildi');
      }
    } else {
      const opp = S.bots.find(b => b.id === S.opponentId);
      if (opp && opp.alive) {
        if (win) {
          const oppDmg = damageFor(S.stage, cb.survivors('ally'));
          opp.hp = Math.max(0, opp.hp - oppDmg);
          pushLog(`⚔️ ${opp.name} yenildi (-${oppDmg} can)`);
          if (opp.hp <= 0 && opp.alive) eliminateBot(opp);
        } else {
          S.hp = Math.max(0, S.hp - playerDmg);
          pushLog(`💀 ${opp.name} kazandı (-${playerDmg} can)`);
        }
      }
      // diğer botlar kendi aralarında
      botVsBotMatches();
    }

    // seri
    if (win) {
      if (S.streak >= 0) S.streak++; else S.streak = 1;
    } else {
      if (S.streak <= 0) S.streak--; else S.streak = -1;
    }
    S.stats.maxStreak = Math.max(S.stats.maxStreak, Math.abs(S.streak));

    // gelir
    const inc = calculateIncome(win);
    addGold(inc.total);
    pushLog(`🪙 Gelir: ${inc.total} (temel 5 + faiz ${inc.interest} + seri ${inc.streak}${inc.win ? ' + zafer 1' : ''})`);
    addXp(2);

    S.result = {
      win, draw, playerDmg,
      enemySurvivors: survivors.length,
      allySurvivors: cb.survivors('ally').length,
      timeout: cb.timeout,
      income: inc,
      label: S.opponentLabel
    };
    S.resultTimer = 2.4;
    S.phase = 'result';
    TFT.UI && TFT.UI.setCombatMode(false);
    TFT.UI && TFT.UI.showResult(S.result);
    TFT.UI && TFT.UI.renderAll();

    if (S.hp <= 0) { S.hp = 0; playerDied(); }
    else if (S.bots.every(b => !b.alive)) { playerWon(); }
  }

  function damageFor(stage, survivors) {
    const base = [0, 2, 2, 3, 4, 5, 6, 8, 10][Math.min(8, stage)] || 10;
    let dmg = base;
    (survivors || []).forEach(u => {
      dmg += (u.star || 1) >= 2 ? 2 : 1;
      if ((u.cost || 0) >= 4) dmg += 1;
    });
    return dmg;
  }

  function calculateIncome(win) {
    const cap = 5 + (S.buffs.interestCap || 0);
    const interest = Math.min(cap, Math.floor(S.gold / 10));
    const abs = Math.abs(S.streak);
    const streakBonus = abs >= 5 ? 3 : abs >= 4 ? 2 : abs >= 3 ? 1 : 0;
    let total = 5 + interest + streakBonus + (win ? 1 : 0) + (S.buffs.goldPerRound || 0);
    if (hasTraitActive('pirate')) { total += 2; }
    return { total, interest: interest, streak: streakBonus, win: win ? 1 : 0 };
  }

  function botVsBotMatches() {
    const alive = S.bots.filter(b => b.alive && b.id !== S.opponentId);
    const arr = shuffle(alive);
    for (let i = 0; i + 1 < arr.length; i += 2) {
      const a = arr[i], b = arr[i + 1];
      const r = Bots.fightBots(a, b);
      let loser = null;
      if (r === 'a') loser = b; else if (r === 'b') loser = a;
      if (!loser) { // beraberlik
        a.hp = Math.max(0, a.hp - 3); b.hp = Math.max(0, b.hp - 3);
        if (a.hp <= 0 && a.alive) eliminateBot(a);
        if (b.hp <= 0 && b.alive) eliminateBot(b);
        continue;
      }
      const dmg = damageFor(S.stage, Array.from({ length: 4 + Math.floor(rnd() * 4) }, () => ({ star: 1 + Math.floor(rnd() * 2), cost: 3 })));
      loser.hp = Math.max(0, loser.hp - dmg);
      if (loser.hp <= 0 && loser.alive) eliminateBot(loser);
    }
  }

  function eliminateBot(bot) {
    if (!bot.alive) return;
    bot.alive = false;
    const aliveCount = 1 + S.bots.filter(b => b.alive).length + (S.alive ? 1 : 0);
    bot.place = Math.max(1, aliveCount);
    pushLog(`☠️ ${bot.name} elendi (${bot.place}.)`);
    TFT.UI && TFT.UI.renderPlayers();
  }

  function saveBest() {
    try {
      const key = 'tft_best_place_v1';
      const best = +(window.localStorage.getItem(key) || 9);
      if (S.place && S.place < best) window.localStorage.setItem(key, S.place);
      return Math.min(best, S.place || 9);
    } catch (e) { return S.place; }
  }
  function getBest() {
    try { return +(window.localStorage.getItem('tft_best_place_v1') || 9); } catch (e) { return 9; }
  }

  function playerDied() {
    S.alive = false;
    S.place = Math.max(1, Math.min(8, S.bots.filter(b => b.alive).length + 1));
    S.phase = 'gameover';
    S.best = saveBest();
    TFT.UI && TFT.UI.showGameOver(false);
  }
  function playerWon() {
    S.place = 1;
    S.phase = 'gameover';
    S.best = saveBest();
    TFT.UI && TFT.UI.showGameOver(true);
  }

  function nextRound() {
    if (S.phase === 'gameover') return;
    S.round++;
    if (S.round > roundsInStage(S.stage)) { S.stage++; S.round = 1; }
    if (S.stage > 8) { // güvenlik
      S.stage = 8;
    }
    beginRound();
  }

  /* ================= TICK ================= */
  function tick(dt) {
    if (S.phase === 'planning') {
      S.timer -= dt;
      if (S.timer <= 0) { S.timer = 0; startCombat(); }
      TFT.UI && TFT.UI.renderTimer();
    } else if (S.phase === 'carousel') {
      S.timer -= dt;
      if (S.timer <= 0) { autoPickCarousel(); }
    } else if (S.phase === 'result') {
      S.resultTimer -= dt;
      if (S.resultTimer <= 0 && S.phase !== 'gameover') nextRound();
    }
  }

  function autoPickCarousel() {
    if (!S.carousel) { S.phase = 'planning'; return; }
    // en pahalı seçeneği al
    let best = 0;
    S.carousel.forEach((o, i) => { if (CH[o.champId].cost > CH[S.carousel[best].champId].cost) best = i; });
    if (!benchFree()) { S.carousel = null; S.phase = 'planning'; S.timer = 30; TFT.UI && TFT.UI.hideModal(); return; }
    pickCarousel(best);
  }

  /* ================= BAŞLAT ================= */
  function init() {
    reset();
    TFT.UI.init();
    TFT.UI.renderAll();
    pushLog('TFT Arena — Offline. İyi şanslar!');
    let seen = false;
    try { seen = !!window.localStorage.getItem('tft_seen_welcome_v1'); } catch (e) { }
    if (!seen) {
      TFT.UI.showWelcome(() => {
        try { window.localStorage.setItem('tft_seen_welcome_v1', '1'); } catch (e) { }
        beginRound();
      });
    } else {
      beginRound();
    }
  }
  function restart() {
    reset();
    TFT.UI.hideModal();
    TFT.UI.setCombatMode(false);
    TFT.UI.renderAll();
    beginRound();
  }

  TFT.Game = {
    S, init, restart, tick,
    rollShop, buyUnit, buyXp, toggleLock,
    placeUnit, benchUnit, sellUnit, autoArrange, unitByUid, allUnits, unitAt,
    equipItem, combineItems, moveItemToSlot, sellItem, addItem,
    pickCarousel, pickAugment, startCombat, combatDone,
    addGold, addXp, healPlayer, addGlobalBuff, giveRandomComponent, giveRandomCompletedItem,
    traitCounts, activeTraits, teamSize, boardCount, sellPrice,
    hasTraitActive, roundPlan, combatType, pushLog, getBest
  };

  // otomatik başlat
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => TFT.Game.init());
  } else {
    setTimeout(() => TFT.Game.init(), 0);
  }
})();

</script>
